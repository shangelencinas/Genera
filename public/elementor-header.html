<script>
(function() {
  'use strict';

  // Esperar a que el DOM esté listo
  function initGeneraHeader() {
    var navbar = document.getElementById('ga-main-navbar');
    var mobileToggleBtn = document.getElementById('ga-mobile-toggle-btn');
    var drawerCloseBtn = document.getElementById('ga-drawer-close-btn');
    var drawerBackdrop = document.getElementById('ga-drawer-backdrop');
    var drawerPanel = document.getElementById('ga-drawer-panel');
    var desktopLinks = document.querySelectorAll('#ga-elementor-header-root .ga-hdr-nav-link');
    var drawerLinks = document.querySelectorAll('#ga-elementor-header-root .ga-drawer-link-item');

    if (!navbar) return;

    // 1. Manejo del Scroll: activar fondo sólido, blur y borde
    var isScrolled = false;
    function handleScroll() {
      var scrollY = window.pageYOffset || document.documentElement.scrollTop || 0;
      if (scrollY > 30) {
        if (!isScrolled) {
          navbar.classList.add('ga-is-scrolled');
          isScrolled = true;
        }
      } else {
        if (isScrolled) {
          navbar.classList.remove('ga-is-scrolled');
          isScrolled = false;
        }
      }

      // Detección de sección activa para resaltar en el menú desktop
      var sections = ['inicio', 'por-que-genera', 'servicios', 'resenas', 'ubicacion', 'contacto'];
      var scrollPosition = scrollY + 220;

      for (var i = 0; i < sections.length; i++) {
        var secId = sections[i];
        var el = document.getElementById(secId);
        if (el) {
          var top = el.offsetTop;
          var height = el.offsetHeight;
          if (scrollPosition >= top && scrollPosition < top + height) {
            updateActiveLink(secId);
            break;
          }
        }
      }
    }

    function updateActiveLink(activeId) {
      desktopLinks.forEach(function(link) {
        var section = link.getAttribute('data-section');
        if (section === activeId) {
          link.classList.add('ga-active');
        } else {
          link.classList.remove('ga-active');
        }
      });
    }

    window.addEventListener('scroll', handleScroll, { passive: true });
    handleScroll(); // Ejecutar al cargar

    // 2. Control de Apertura / Cierre del Menú Móvil
    function openMobileDrawer() {
      if (drawerBackdrop) {
        drawerBackdrop.classList.add('ga-open');
        document.body.style.overflow = 'hidden'; // Evita scroll de fondo
      }
    }

    function closeMobileDrawer() {
      if (drawerBackdrop) {
        drawerBackdrop.classList.remove('ga-open');
        document.body.style.overflow = '';
      }
    }

    if (mobileToggleBtn) {
      mobileToggleBtn.addEventListener('click', function(e) {
        e.preventDefault();
        openMobileDrawer();
      });
    }

    if (drawerCloseBtn) {
      drawerCloseBtn.addEventListener('click', function(e) {
        e.preventDefault();
        closeMobileDrawer();
      });
    }

    // Cerrar al hacer clic en el fondo oscuro
    if (drawerBackdrop) {
      drawerBackdrop.addEventListener('click', function(e) {
        if (e.target === drawerBackdrop) {
          closeMobileDrawer();
        }
      });
    }

    // Evitar que clics dentro del panel cierren el drawer
    if (drawerPanel) {
      drawerPanel.addEventListener('click', function(e) {
        e.stopPropagation();
      });
    }

    // Cerrar el drawer al pulsar en cualquier enlace de navegación móvil
    drawerLinks.forEach(function(link) {
      link.addEventListener('click', function() {
        closeMobileDrawer();
      });
    });

    // Cerrar drawer con tecla ESC
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && drawerBackdrop && drawerBackdrop.classList.contains('ga-open')) {
        closeMobileDrawer();
      }
    });

    // 3. Desplazamiento Suave (Smooth Scroll) para enlaces con ancla '#'
    var allAnchorLinks = document.querySelectorAll('#ga-elementor-header-root a[href^="#"]');
    allAnchorLinks.forEach(function(anchor) {
      anchor.addEventListener('click', function(e) {
        var targetId = this.getAttribute('href');
        if (targetId && targetId !== '#') {
          var targetEl = document.querySelector(targetId);
          if (targetEl) {
            e.preventDefault();
            var headerHeight = navbar.offsetHeight || 75;
            var elementPosition = targetEl.getBoundingClientRect().top;
            var offsetPosition = elementPosition + window.pageYOffset - (headerHeight - 10);

            window.scrollTo({
              top: offsetPosition,
              behavior: 'smooth'
            });
          }
        }
      });
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initGeneraHeader);
  } else {
    initGeneraHeader();
  }
})();
</script>
